name: MCP Playground CI

on:
  push:
    branches:
      - mcp-playground
    paths:
      - "mcp-playground/**"
      - ".github/workflows/mcp-playground.yml"
  pull_request:
    paths:
      - "mcp-playground/**"
      - ".github/workflows/mcp-playground.yml"
  workflow_dispatch:

jobs:
  validate-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-playground

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mcp-playground/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: MCP protocol smoke test
        run: python smoke_test.py
